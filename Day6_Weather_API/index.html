<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
                        
        <div class="search-container">
            <input type="text" placeholder="Enter a City name..." id="searchBar">
            <button id="searchBtn" >Search</button>
        </div>

        <div class="showWeather-container">
            <h1 id="deg"></h1>
            <h2 id="Cityname"></h2>

            <section>
                <h1 id="humid"></h1>
            </section>

            <section>
                <h1 id="speed"></h1>
            </section>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
